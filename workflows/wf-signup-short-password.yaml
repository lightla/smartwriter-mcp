name: Signup - Short Password
description: Verify that entering a password shorter than 6 characters shows "at least 6 characters" error and blocks submission
group: Signup/Fail
stopOnFail: false
steps:
  - navigate: /test/
  - wait: 1000
  - smart_fill:
      target: Enter your full name
      value: Test User
  - smart_fill:
      target: Enter your email
      value: short@test.com
  - smart_type:
      target: Min 6 characters
      text: abc
  - smart_check: I agree to the terms
  - click:
      selector: '#submit-btn'
  - expect:
      visible: "at least 6"
      not_visible: "Submitted"