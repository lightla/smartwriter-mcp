<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Smartwriter Dashboard</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/codemirror@5.65.18/lib/codemirror.min.css">
<style>
* { box-sizing: border-box; margin: 0; padding: 0; }
body { font-family: -apple-system, system-ui, sans-serif; background: #0f172a; color: #e2e8f0; min-height: 100vh; }
.header { background: linear-gradient(135deg, #1e293b, #0f172a); border-bottom: 1px solid #334155; padding: 16px 32px; display: flex; align-items: center; gap: 16px; }
.header h1 { font-size: 22px; font-weight: 700; color: #38bdf8; }
.header .subtitle { color: #94a3b8; font-size: 13px; }
.nav-links { margin-left: auto; display: flex; gap: 12px; }
.nav-links a { color: #94a3b8; text-decoration: none; padding: 6px 14px; border-radius: 6px; font-size: 13px; transition: all 0.15s; }
.nav-links a:hover { background: #1e293b; color: #e2e8f0; }

/* Layout: left sidebar + right panel */
.main { max-width: 1400px; margin: 0 auto; padding: 24px 32px; display: grid; grid-template-columns: 380px 1fr; gap: 24px; height: calc(100vh - 68px); }

/* Cards */
.card { background: #1e293b; border: 1px solid #334155; border-radius: 12px; padding: 16px; }
.card h2 { font-size: 15px; font-weight: 600; color: #38bdf8; margin-bottom: 10px; display: flex; align-items: center; gap: 8px; }
.card h2 .icon { font-size: 16px; }

/* Status */
.status-dot { width: 8px; height: 8px; border-radius: 50%; display: inline-block; }
.status-dot.connected { background: #22c55e; }
.status-dot.disconnected { background: #ef4444; }

/* Left sidebar */
.sidebar { display: flex; flex-direction: column; gap: 16px; overflow-y: auto; }
.sidebar .card { flex-shrink: 0; }
.tab-list { display: flex; flex-direction: column; gap: 6px; max-height: 120px; overflow-y: auto; }
.tab-item { display: flex; align-items: center; gap: 10px; padding: 8px 12px; background: #0f172a; border-radius: 8px; border: 1px solid #1e293b; }
.tab-item .tab-info { flex: 1; min-width: 0; }
.tab-item .tab-title { font-size: 13px; font-weight: 500; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.tab-item .tab-url { font-size: 11px; color: #64748b; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }

/* Workflow list */
.workflow-actions { display: flex; gap: 8px; align-items: center; margin-bottom: 8px; }
.workflow-list { display: flex; flex-direction: column; gap: 6px; max-height: 280px; overflow-y: auto; }
.workflow-item { display: flex; align-items: center; gap: 8px; padding: 8px 12px; background: #0f172a; border-radius: 8px; border: 1px solid #1e293b; transition: border-color 0.15s; }
.workflow-item.selected { border-color: #2563eb; background: rgba(37,99,235,0.08); }
.workflow-item .wf-check { width: 16px; height: 16px; accent-color: #2563eb; cursor: pointer; flex-shrink: 0; }
.workflow-item .wf-info { flex: 1; min-width: 0; }
.workflow-item .wf-name { font-size: 13px; font-weight: 500; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.workflow-item .wf-desc { font-size: 11px; color: #64748b; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.workflow-item .wf-group { font-size: 10px; color: #475569; }

/* Right panel - tabbed */
.right-panel { display: flex; flex-direction: column; overflow: hidden; }
.tab-bar { display: flex; background: #1e293b; border: 1px solid #334155; border-bottom: none; border-radius: 12px 12px 0 0; overflow: hidden; }
.tab-btn { padding: 10px 20px; font-size: 13px; font-weight: 600; color: #94a3b8; background: transparent; border: none; cursor: pointer; border-bottom: 2px solid transparent; transition: all 0.15s; }
.tab-btn:hover { color: #e2e8f0; background: rgba(255,255,255,0.03); }
.tab-btn.active { color: #38bdf8; border-bottom-color: #38bdf8; background: rgba(56,189,248,0.05); }
.tab-content { flex: 1; background: #1e293b; border: 1px solid #334155; border-top: none; border-radius: 0 0 12px 12px; overflow: hidden; }
.tab-pane { display: none; height: 100%; overflow-y: auto; }
.tab-pane.active { display: flex; flex-direction: column; }

/* Log pane */
.log-content { flex: 1; padding: 16px; font-family: 'SF Mono', 'Fira Code', monospace; font-size: 12px; line-height: 1.6; overflow-y: auto; }
.log-entry { padding: 8px 0; border-bottom: 1px solid #1e293b; }
.log-entry:last-child { border-bottom: none; }
.log-entry-header { font-weight: 600; margin-bottom: 4px; display: flex; align-items: center; gap: 8px; }
.log-pass { color: #22c55e; }
.log-fail { color: #ef4444; }
.log-warn { color: #eab308; }
.log-info { color: #94a3b8; }
.log-step { padding-left: 16px; }
.log-summary { margin-top: 12px; padding: 10px; background: #0f172a; border-radius: 8px; font-weight: 600; }
.log-empty { color: #64748b; font-style: italic; padding: 40px; text-align: center; }
.log-wf-name { font-weight: 600; color: #e2e8f0; }

/* Editor pane */
.editor-toolbar { display: flex; gap: 8px; padding: 8px 16px; align-items: center; border-bottom: 1px solid #334155; flex-shrink: 0; }
.editor-toolbar .filename { font-size: 13px; color: #94a3b8; font-family: monospace; flex: 1; }
.CodeMirror { height: calc(100% - 48px); border-radius: 0; }

/* Buttons */
.btn { padding: 6px 14px; border-radius: 6px; border: none; cursor: pointer; font-size: 13px; font-weight: 500; transition: all 0.15s; }
.btn-primary { background: #2563eb; color: white; }
.btn-primary:hover { background: #1d4ed8; }
.btn-secondary { background: #334155; color: #e2e8f0; }
.btn-secondary:hover { background: #475569; }
.sample-app-link { font-size: 12px; color: #38bdf8; text-decoration: none; padding: 4px 10px; border-radius: 6px; border: 1px solid #334155; transition: all 0.15s; }
.sample-app-link:hover { background: #1e293b; border-color: #38bdf8; }
.btn-danger { background: #991b1b; color: #e2e8f0; }
.btn-danger:hover { background: #b91c1c; }
.btn-success { background: #059669; color: white; }
.btn-success:hover { background: #047857; }
.btn-sm { padding: 4px 10px; font-size: 12px; }
.btn:disabled { opacity: 0.5; cursor: not-allowed; }
.btn-xs { padding: 3px 8px; font-size: 11px; border-radius: 4px; }

/* Toast */
.toast { position: fixed; bottom: 20px; right: 20px; padding: 12px 20px; border-radius: 8px; font-size: 14px; font-weight: 500; z-index: 9999; transition: opacity 0.3s; opacity: 0; }
.toast.show { opacity: 1; }
.toast.success { background: #059669; color: white; }
.toast.error { background: #991b1b; color: white; }
.toast.info { background: #2563eb; color: white; }

/* Scrollbar */
::-webkit-scrollbar { width: 6px; }
::-webkit-scrollbar-track { background: #0f172a; }
::-webkit-scrollbar-thumb { background: #334155; border-radius: 3px; }
::-webkit-scrollbar-thumb:hover { background: #475569; }
</style>
</head>
<body>
<div class="header">
  <h1>Smartwriter</h1>
  <span class="subtitle">Workflow Dashboard</span>
  <div class="nav-links">
    <a href="/">Home</a>
    <a href="/results">Results</a>
    <a href="/test/">Sample App</a>
  </div>
</div>

<div class="main">
  <!-- Left sidebar -->
  <div class="sidebar">
    <!-- Connected Tab -->
    <div class="card">
      <h2><span class="icon">&#9654;</span> Connected Tab <span class="status-dot disconnected" id="status-dot"></span></h2>
      <div id="connected-info" style="color:#64748b;font-size:13px;">Not connected</div>
      <div style="margin-top:10px;display:flex;gap:8px;align-items:center;">
        <button class="btn btn-sm btn-primary" onclick="launchSampleApp()">Start Sample App</button>
        <a href="/test/" target="_blank" class="sample-app-link" id="sample-app-link">Open Sample App</a>
        <span style="flex:1;"></span>
        <button class="btn btn-sm btn-secondary" onclick="refreshTabs()">Refresh</button>
      </div>
    </div>

    <!-- Chrome Tabs -->
    <div class="card">
      <h2><span class="icon">&#128449;</span> Chrome Tabs</h2>
      <div id="tab-list" class="tab-list">
        <div style="color:#64748b;font-size:13px;">Loading...</div>
      </div>
    </div>

    <!-- Workflows -->
    <div class="card" style="flex:1;display:flex;flex-direction:column;min-height:0;">
      <h2 style="margin-bottom:8px;"><span class="icon">&#9881;</span> Workflows</h2>
      <div class="workflow-actions">
        <label style="display:flex;align-items:center;gap:6px;font-size:12px;color:#94a3b8;cursor:pointer;"><input type="checkbox" id="select-all-wf" onchange="toggleSelectAll(this.checked)" style="accent-color:#2563eb;"> All</label>
        <button class="btn btn-xs btn-primary" onclick="runSelectedWorkflows()" id="run-selected-btn" disabled>Run Selected</button>
        <span style="flex:1;"></span>
        <button class="btn btn-xs btn-secondary" onclick="refreshWorkflows()">Refresh</button>
        <button class="btn btn-xs btn-success" onclick="newWorkflow()">New</button>
        <label class="btn btn-xs btn-secondary" style="cursor:pointer;">Upload <input type="file" accept=".yaml,.yml" onchange="uploadWorkflow(event)" style="display:none;"></label>
      </div>
      <div id="workflow-list" class="workflow-list">
        <div style="color:#64748b;font-size:13px;">Loading...</div>
      </div>
    </div>
  </div>

  <!-- Right panel: tabbed Log + Editor -->
  <div class="right-panel">
    <div class="tab-bar">
      <button class="tab-btn active" data-tab="log" onclick="switchTab('log')">&#9654; Log</button>
      <button class="tab-btn" data-tab="editor" onclick="switchTab('editor')">&#9998; Editor</button>
      <span style="flex:1;"></span>
      <button class="tab-btn" onclick="clearLog()" style="color:#64748b;font-size:12px;" title="Clear log">&#128465;</button>
    </div>
    <div class="tab-content">
      <div class="tab-pane active" id="pane-log">
        <div class="log-content" id="log-content">
          <div class="log-empty">Run a workflow to see output here</div>
        </div>
      </div>
      <div class="tab-pane" id="pane-editor">
        <div class="editor-toolbar">
          <span class="filename" id="editor-filename">No file selected</span>
          <button class="btn btn-xs btn-secondary" onclick="saveWorkflow()" id="save-btn" disabled>Save</button>
          <button class="btn btn-xs btn-success" onclick="runCurrentWorkflow()" id="run-btn" disabled>Run</button>
        </div>
        <textarea id="yaml-editor"></textarea>
      </div>
    </div>
  </div>
</div>

<div class="toast" id="toast"></div>

<script src="https://cdn.jsdelivr.net/npm/codemirror@5.65.18/lib/codemirror.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/codemirror@5.65.18/mode/yaml/yaml.min.js"></script>
<script>
const PORT = location.port || 9223;
const API = '';
let editor = null;
let currentFile = null;
let originalContent = '';
let allWorkflows = [];

// --- Tab switching ---
function switchTab(tab) {
  document.querySelectorAll('.tab-btn').forEach(b => b.classList.toggle('active', b.dataset.tab === tab));
  document.querySelectorAll('.tab-pane').forEach(p => p.classList.remove('active'));
  document.getElementById('pane-' + tab).classList.add('active');
  if (tab === 'editor' && editor) editor.refresh();
}

// --- Toast ---
function showToast(msg, type='info') {
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.className = 'toast ' + type + ' show';
  setTimeout(() => t.className = 'toast ' + type, 2500);
}

// --- API ---
async function api(path, opts={}) {
  const res = await fetch(API + path, opts);
  return res.json();
}

// --- Tabs ---
async function refreshTabs() {
  try {
    const tabs = await api('/api/tabs');
    const list = document.getElementById('tab-list');
    if (!tabs || tabs.length === 0) {
      list.innerHTML = '<div style="color:#64748b;font-size:13px;">No tabs found</div>';
      return;
    }
    list.innerHTML = tabs.map(t => `
      <div class="tab-item">
        <div class="tab-info">
          <div class="tab-title">${escHtml(t.title||'Untitled')}</div>
          <div class="tab-url">${escHtml(t.url||'')}</div>
        </div>
        <button class="btn btn-xs btn-primary" onclick="connectTab(${t.tabId})">Connect</button>
      </div>
    `).join('');
  } catch (e) {
    document.getElementById('tab-list').innerHTML = '<div style="color:#ef4444;font-size:13px;">Extension not connected</div>';
  }
  refreshConnectedTab();
}

async function refreshConnectedTab() {
  const dot = document.getElementById('status-dot');
  const info = document.getElementById('connected-info');
  try {
    const tab = await api('/api/connected-tab');
    if (tab.connected === false) throw new Error('Not connected');
    dot.className = 'status-dot connected';
    info.innerHTML = `<strong>${escHtml(tab.title||'')}</strong><br><span style="color:#64748b;font-size:12px;">${escHtml(tab.url||'')} (tabId: ${tab.tabId})</span>`;
  } catch {
    dot.className = 'status-dot disconnected';
    info.textContent = 'Not connected';
  }
}

async function connectTab(tabId) {
  try {
    await api('/api/connect-tab', { method: 'POST', headers: {'Content-Type':'application/json'}, body: JSON.stringify({tabId}) });
    showToast('Connected to tab ' + tabId, 'success');
    refreshTabs();
  } catch (e) {
    showToast('Connect failed: ' + (e.message||e), 'error');
  }
}

async function launchSampleApp() {
  try {
    await api('/api/connect-tab', { method: 'POST', headers: {'Content-Type':'application/json'}, body: JSON.stringify({}) });
  } catch {}
  try {
    const ws = new WebSocket(`ws://localhost:${PORT}`);
    ws.onopen = () => {
      ws.send(JSON.stringify({ type: 'COMMAND', command: 'NAVIGATE', requestId: 'nav-' + Date.now(), args: { url: `http://localhost:${PORT}/test/` } }));
      ws.close();
    };
    showToast('Sample app loaded in connected tab', 'success');
  } catch (e) {
    showToast('Failed: ' + (e.message||e), 'error');
  }
}

// --- Workflows ---
async function refreshWorkflows() {
  try {
    const workflows = await api('/api/workflows');
    const list = document.getElementById('workflow-list');
    allWorkflows = workflows || [];
    if (!workflows || workflows.length === 0) {
      list.innerHTML = '<div style="color:#64748b;font-size:13px;">No workflows found</div>';
      document.getElementById('run-selected-btn').disabled = true;
      return;
    }
    list.innerHTML = workflows.map(w => `
      <div class="workflow-item" data-wf-name="${escAttr(w.name)}">
        <input type="checkbox" class="wf-check" data-wf-name="${escAttr(w.name)}" onchange="onWfCheckChange()">
        <div class="wf-info">
          <div class="wf-name">${escHtml(w.displayName)}</div>
          ${w.description ? '<div class="wf-desc">'+escHtml(w.description)+'</div>' : ''}
          ${w.group ? '<div class="wf-group">'+escHtml(w.group)+'</div>' : ''}
        </div>
        <button class="btn btn-xs btn-secondary" onclick="editWorkflow('${escAttr(w.name)}')" title="Edit">Edit</button>
        <button class="btn btn-xs btn-success" onclick="runWorkflow('${escAttr(w.name)}')" title="Run">Run</button>
      </div>
    `).join('');
    onWfCheckChange();
  } catch (e) {
    document.getElementById('workflow-list').innerHTML = '<div style="color:#ef4444;font-size:13px;">Failed to load workflows</div>';
  }
}

function toggleSelectAll(checked) {
  document.querySelectorAll('.wf-check').forEach(cb => cb.checked = checked);
  onWfCheckChange();
}

function onWfCheckChange() {
  const checks = document.querySelectorAll('.wf-check');
  const checked = [...checks].filter(cb => cb.checked);
  document.getElementById('run-selected-btn').disabled = checked.length === 0;
  document.getElementById('run-selected-btn').textContent = checked.length > 0 ? `Run (${checked.length})` : 'Run Selected';
  const selectAll = document.getElementById('select-all-wf');
  if (selectAll) {
    selectAll.checked = checks.length > 0 && checked.length === checks.length;
    selectAll.indeterminate = checked.length > 0 && checked.length < checks.length;
  }
  document.querySelectorAll('.workflow-item[data-wf-name]').forEach(item => {
    const cb = item.querySelector('.wf-check');
    item.classList.toggle('selected', cb && cb.checked);
  });
}

// --- Log output ---
function clearLog() {
  const el = document.getElementById('log-content');
  el.innerHTML = '<div class="log-empty">Run a workflow to see output here</div>';
}

// --- Run ---
// Step queue: ensures each step is rendered in its own animation frame
// so they appear one by one even if SSE events arrive in a single chunk.
function createStepRenderer(entry, el, name) {
  const queue = [];
  let processing = false;

  function processNext() {
    if (queue.length === 0) { processing = false; return; }
    processing = true;
    const { s, stepIndex, totalSteps } = queue.shift();
    const cls = s.status === 'passed' ? 'log-pass' : 'log-fail';
    const icon = s.status === 'passed' ? '✓' : '✗';
    const stepLine = document.createElement('div');
    stepLine.className = 'log-step';
    stepLine.innerHTML = `<span class="${cls}">${icon}</span> Step ${s.step}: ${escHtml(s.tool)}${s.error ? ' <span class="log-fail">('+escHtml(s.error)+')</span>' : ''}`;
    entry.appendChild(stepLine);
    entry.querySelector('.log-entry-header').innerHTML = `<span class="log-info">⏳</span> <span class="log-wf-name">${escHtml(name)}</span> <span class="log-info">${stepIndex + 1}/${totalSteps}</span>`;
    el.scrollTop = el.scrollHeight;
    // Small delay so the browser paints each step before the next
    setTimeout(processNext, 10);
  }

  return function enqueueStep(s, stepIndex, totalSteps) {
    queue.push({ s, stepIndex, totalSteps });
    if (!processing) processNext();
  };
}

function runWorkflow(name) {
  return new Promise((resolve) => {
  switchTab('log');
  const el = document.getElementById('log-content');
  const empty = el.querySelector('.log-empty');
  if (empty) empty.remove();

  const entry = document.createElement('div');
  entry.className = 'log-entry';
  entry.innerHTML = `<div class="log-entry-header"><span class="log-info">⏳</span> <span class="log-wf-name">${escHtml(name)}</span> <span class="log-info">running...</span></div>`;
  el.appendChild(entry);
  el.scrollTop = el.scrollHeight;

  const renderStep = createStepRenderer(entry, el, name);
  const url = `${API}/api/run-workflow-stream?name=${encodeURIComponent(name)}&sessionId=dash-${Date.now()}`;
  const es = new EventSource(url);
  let wfResult = null;

  es.addEventListener('step', (e) => {
    const data = JSON.parse(e.data);
    renderStep(data.step, data.stepIndex, data.totalSteps);
  });

  es.addEventListener('done', (e) => {
    wfResult = JSON.parse(e.data).result;
    es.close();
    finalizeEntry();
  });

  es.addEventListener('error', () => {
    es.close();
    finalizeEntry();
  });

  function finalizeEntry() {
    if (wfResult) {
      const r = wfResult;
      const statusIcon = r.failed > 0 ? '<span class="log-fail">✗</span>' : '<span class="log-pass">✓</span>';
      const statusText = r.failed > 0 ? `<span class="log-fail">${r.failed} failed</span>` : '<span class="log-pass">all passed</span>';
      const duration = (r.steps||[]).reduce((s,st) => s + (st.duration||0), 0);
      entry.querySelector('.log-entry-header').innerHTML = `${statusIcon} <span class="log-wf-name">${escHtml(r.name||name)}</span> ${statusText} · ${r.passed}/${r.total} · ${duration}ms`;
      showToast('Completed: ' + name, 'success');
    } else {
      showToast('Failed: ' + name, 'error');
    }
    resolve();
  }
  });
}

function runCurrentWorkflow() {
  if (!currentFile) return;
  switchTab('log');
  const yamlContent = editor.getValue();
  const name = currentFile;
  const el = document.getElementById('log-content');
  const empty = el.querySelector('.log-empty');
  if (empty) empty.remove();

  const entry = document.createElement('div');
  entry.className = 'log-entry';
  entry.innerHTML = `<div class="log-entry-header"><span class="log-info">⏳</span> <span class="log-wf-name">${escHtml(name)}</span> <span class="log-info">running (editor)...</span></div>`;
  el.appendChild(entry);
  el.scrollTop = el.scrollHeight;

  const renderStep = createStepRenderer(entry, el, name);
  const url = `${API}/api/run-workflow-stream?yaml=${encodeURIComponent(yamlContent)}&sessionId=dash-${Date.now()}`;
  const es = new EventSource(url);
  let wfResult = null;

  es.addEventListener('step', (e) => {
    const data = JSON.parse(e.data);
    renderStep(data.step, data.stepIndex, data.totalSteps);
  });

  es.addEventListener('done', (e) => {
    wfResult = JSON.parse(e.data).result;
    es.close();
    finalizeEntry();
  });

  es.addEventListener('error', () => {
    es.close();
    finalizeEntry();
  });

  function finalizeEntry() {
    if (wfResult) {
      const r = wfResult;
      const statusIcon = r.failed > 0 ? '<span class="log-fail">✗</span>' : '<span class="log-pass">✓</span>';
      const statusText = r.failed > 0 ? `<span class="log-fail">${r.failed} failed</span>` : '<span class="log-pass">all passed</span>';
      const duration = (r.steps||[]).reduce((s,st) => s + (st.duration||0), 0);
      entry.querySelector('.log-entry-header').innerHTML = `${statusIcon} <span class="log-wf-name">${escHtml(r.name||name)}</span> ${statusText} · ${r.passed}/${r.total} · ${duration}ms`;
      showToast('Completed: ' + name, 'success');
    } else {
      showToast('Failed: ' + name, 'error');
    }
  }
}

async function runSelectedWorkflows() {
  const checked = [...document.querySelectorAll('.wf-check:checked')];
  if (checked.length === 0) return;
  const btn = document.getElementById('run-selected-btn');
  btn.disabled = true;
  for (let i = 0; i < checked.length; i++) {
    btn.textContent = `${i+1}/${checked.length}`;
    await runWorkflow(checked[i].dataset.wfName);
  }
  btn.disabled = false;
  onWfCheckChange();
}

// --- Editor ---
async function editWorkflow(name) {
  try {
    const res = await fetch(API + '/api/workflow-file?name=' + encodeURIComponent(name));
    const content = await res.text();
    currentFile = name;
    originalContent = content;
    document.getElementById('editor-filename').textContent = name;
    document.getElementById('save-btn').disabled = false;
    document.getElementById('run-btn').disabled = false;
    editor.setValue(content);
    switchTab('editor');
  } catch (e) {
    showToast('Failed to load: ' + (e.message||e), 'error');
  }
}

async function saveWorkflow() {
  if (!currentFile) {
    currentFile = prompt('Enter filename (e.g. wf-my-test.yaml):');
    if (!currentFile) return;
    if (!currentFile.match(/\.(yaml|yml)$/)) currentFile += '.yaml';
  }
  try {
    await api('/api/workflow-file', {
      method: 'PUT',
      headers: {'Content-Type':'application/json'},
      body: JSON.stringify({ name: currentFile, content: editor.getValue() })
    });
    showToast('Saved ' + currentFile, 'success');
    originalContent = editor.getValue();
    refreshWorkflows();
  } catch (e) {
    showToast('Save failed: ' + (e.message||e), 'error');
  }
}

function newWorkflow() {
  currentFile = null;
  originalContent = '';
  document.getElementById('editor-filename').textContent = 'New workflow (save to name it)';
  document.getElementById('save-btn').disabled = false;
  document.getElementById('run-btn').disabled = true;
  const template = `name: New Workflow\ndescription: Describe what this workflow tests\ngroup: Demo\nstopOnFail: false\nsteps:\n  - navigate: /test/\n  - wait: 1000\n  - smart_click: "Sign Up"\n  - smart_fill:\n      target: "Enter your full name"\n      value: "Test User"\n`;
  editor.setValue(template);
  switchTab('editor');
}

async function uploadWorkflow(event) {
  const file = event.target.files[0];
  if (!file) return;
  const content = await file.text();
  currentFile = file.name;
  originalContent = content;
  document.getElementById('editor-filename').textContent = file.name;
  document.getElementById('save-btn').disabled = false;
  document.getElementById('run-btn').disabled = false;
  editor.setValue(content);
  switchTab('editor');
  try {
    await api('/api/workflow-file', {
      method: 'PUT',
      headers: {'Content-Type':'application/json'},
      body: JSON.stringify({ name: file.name, content })
    });
    showToast('Uploaded ' + file.name, 'success');
    refreshWorkflows();
  } catch (e) {
    showToast('Upload failed: ' + (e.message||e), 'error');
  }
}

function escHtml(s) { return (s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;'); }
function escAttr(s) { return (s||'').replace(/'/g, "\\'").replace(/"/g, '&quot;'); }

// Init
document.addEventListener('DOMContentLoaded', () => {
  editor = CodeMirror.fromTextArea(document.getElementById('yaml-editor'), {
    mode: 'yaml',
    lineNumbers: true,
    theme: 'monokai',
    tabSize: 2,
    indentWithTabs: false,
    lineWrapping: true,
  });
  refreshTabs();
  refreshWorkflows();
});
</script>
