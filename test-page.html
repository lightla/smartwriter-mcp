<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Smartwriter Test Page</title>
  <style>
    body { font-family: system-ui; max-width: 600px; margin: 40px auto; padding: 0 20px; }
    input, select, button, textarea { display: block; width: 100%; margin: 8px 0 16px; padding: 8px; font-size: 14px; }
    button { background: #2563eb; color: white; border: none; border-radius: 4px; cursor: pointer; }
    button:hover { background: #1d4ed8; }
    label { font-weight: 600; display: block; margin-top: 12px; }
    #output { background: #f1f5f9; padding: 12px; border-radius: 4px; min-height: 60px; margin-top: 16px; }
    .checkbox-group { display: flex; gap: 16px; align-items: center; margin: 8px 0 16px; }
    .checkbox-group label { font-weight: normal; display: inline; }
  </style>
</head>
<body>
  <h1>Smartwriter Test Page</h1>

  <label for="email">Email</label>
  <input type="email" id="email" placeholder="Enter your email">

  <label for="password">Password</label>
  <input type="password" id="password" placeholder="Enter your password">

  <label for="message">Message</label>
  <textarea id="message" rows="3" placeholder="Type a message"></textarea>

  <label for="country">Country</label>
  <select id="country">
    <option value="">Select country</option>
    <option value="vn">Vietnam</option>
    <option value="us">United States</option>
    <option value="jp">Japan</option>
  </select>

  <div class="checkbox-group">
    <input type="checkbox" id="agree">
    <label for="agree">I agree to the terms</label>
  </div>

  <div class="checkbox-group">
    <input type="checkbox" id="newsletter" checked>
    <label for="newsletter">Subscribe to newsletter</label>
  </div>

  <button id="submit-btn" onclick="handleSubmit()">Submit</button>
  <button id="reset-btn" onclick="handleReset()">Reset</button>

  <div id="output">Output will appear here...</div>

  <script>
    function handleSubmit() {
      const email = document.getElementById('email').value;
      const password = document.getElementById('password').value;
      const message = document.getElementById('message').value;
      const country = document.getElementById('country').value;
      const agree = document.getElementById('agree').checked;
      const output = document.getElementById('output');
      if (!email || !password) {
        output.textContent = 'Error: Email and Password are required!';
        output.style.color = 'red';
        console.error('Validation failed: missing required fields');
        return;
      }
      if (!agree) {
        output.textContent = 'Error: You must agree to the terms!';
        output.style.color = 'red';
        return;
      }
      output.innerHTML = '<strong>Submitted!</strong><br>Email: ' + email + '<br>Country: ' + country + '<br>Message: ' + message;
      output.style.color = 'green';
    }

    function handleReset() {
      document.getElementById('email').value = '';
      document.getElementById('password').value = '';
      document.getElementById('message').value = '';
      document.getElementById('country').value = '';
      document.getElementById('agree').checked = false;
      document.getElementById('newsletter').checked = true;
      document.getElementById('output').textContent = 'Output will appear here...';
      document.getElementById('output').style.color = 'inherit';
    }
  </script>
</body>
</html>
